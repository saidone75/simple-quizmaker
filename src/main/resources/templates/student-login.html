<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz scolastici per studenti | Alice's Simple Quiz Maker</title>
    <meta name="description"
          content="Crea quiz scolastici, anche con AI, condividili con gli altri insegnanti e segui i progressi degli studenti con risultati e badge. Software libero e open source.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://quiz.saidone.org/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="it_IT">
    <meta property="og:site_name" content="Alice's Simple Quiz Maker">
    <meta property="og:title" content="Quiz scolastici per studenti | Alice's Simple Quiz Maker">
    <meta property="og:description"
          content="Crea quiz scolastici, anche con AI, condividili con gli altri insegnanti e segui i progressi degli studenti con risultati e badge. Software libero e open source.">
    <meta property="og:url" content="https://quiz.saidone.org/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Quiz scolastici per studenti | Alice's Simple Quiz Maker">
    <meta name="twitter:description"
          content="Crea quiz scolastici, anche con AI, condividili con gli altri insegnanti e segui i progressi degli studenti con risultati e badge. Software libero e open source.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebSite",
                    "name": "Alice's Simple Quiz Maker",
                    "url": "https://quiz.saidone.org/",
                    "inLanguage": "it",
                    "description": "Applicazione web libera e open source per creare e somministrare quiz scolastici."
                },
                {
                    "@type": "WebApplication",
                    "name": "Alice's Simple Quiz Maker",
                    "url": "https://quiz.saidone.org/",
                    "description": "Crea quiz scolastici, anche con AI, condividili con gli altri insegnanti e segui i progressi degli studenti con risultati e badge. Software libero e open source.",
                    "applicationCategory": "EducationalApplication",
                    "operatingSystem": "Web browser",
                    "inLanguage": "it",
                    "license": "https://www.gnu.org/licenses/gpl-3.0.html",
                    "codeRepository": "https://github.com/saidone75/simple-quizmaker",
                    "featureList": [
                        "Quiz scolastici",
                        "Generazione quiz con AI",
                        "Risultati e progressi",
                        "Condivisione tra insegnanti"
                    ]
                }
            ]
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="screen active" style="display:flex;align-items:center;justify-content:center;">
    <div class="quiz-card" style="max-width:420px;width:92%;text-align:center;">
        <h1 class="login-title" style="margin-bottom:0.5rem;">Alice's Simple Quiz&nbsp;Maker</h1>
        <p class="login-sub">Quiz scolastici per imparare divertendosi</p>
        <button type="button" class="error-emoji login-qr-trigger" id="login-qr-trigger"
                aria-label="Mostra il QR code per accedere al sito" title="Mostra QR code"
                aria-expanded="false" aria-controls="login-qr-panel">🐰</button>
        <h2>Accesso studenti</h2>
        <p>Inserisci la parola chiave di 5 caratteri assegnata dalla maestra.</p>
        <div id="login-qr-panel" class="login-qr-panel" hidden>
            <button type="button" id="login-qr-close" class="login-qr-image-button" aria-label="Nascondi QR code"
                    title="Clicca per richiudere">
                <img id="login-qr-image" th:data-src="@{/student/login-qr}" width="256" height="256"
                     alt="QR code con il link alla pagina di accesso studenti" class="login-qr-image">
            </button>
            <p id="login-qr-error" class="login-qr-error" role="alert" hidden>Impossibile caricare il QR code. Clicca sul coniglio per richiudere e riprova.</p>
        </div>
        <form id="student-login-form" th:action="@{/student/login}" method="post"
              style="display:grid;gap:12px;margin-top:14px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input id="keyword-hidden" type="hidden" name="keyword" maxlength="5" minlength="5" required/>
            <div class="otp-group" aria-label="Parola chiave di 5 caratteri">
                <input class="otp-input" type="text" inputmode="text" maxlength="1" autocomplete="one-time-code"
                       aria-label="Carattere 1">
                <input class="otp-input" type="text" inputmode="text" maxlength="1" aria-label="Carattere 2">
                <input class="otp-input" type="text" inputmode="text" maxlength="1" aria-label="Carattere 3">
                <input class="otp-input" type="text" inputmode="text" maxlength="1" aria-label="Carattere 4">
                <input class="otp-input" type="text" inputmode="text" maxlength="1" aria-label="Carattere 5">
            </div>
            <button class="quiz-next" style="display:block">Entra</button>
        </form>
        <p th:if="${loginError}" th:text="${loginError}" style="margin-top:12px;color:var(--red);font-weight:700"></p>
        <p class="login-footer profile-password-submit">
            <a th:href="@{/teacher/login}" class="public-link">
                → Accesso insegnanti
            </a>
        </p>
    </div>
</div>



<script th:src="@{/js/student-login.js}"></script>

</body>
</html>
