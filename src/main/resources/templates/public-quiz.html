<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${publicQuiz.title + ' — Alice’s Simple Quiz Maker'}">Quiz pubblico</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{student :: playerTopbar}"></div>
<div th:replace="~{student :: quizPlayer}"></div>
<div th:replace="~{student :: quizResult}"></div>
<div th:replace="~{student :: studentAlert}"></div>
<div id="public-quiz-data" th:attr="data-quiz-json=${publicQuizJson}" hidden></div>
<script th:src="@{/js/game-sounds.js}"></script>
<script th:src="@{/js/quiz-celebration.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/quiz-player.js(v=public-completion-1)}"></script>
<script th:src="@{/js/public-quiz.js(v=public-completion-1)}"></script>
</body>
</html>
